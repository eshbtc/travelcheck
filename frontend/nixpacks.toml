[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --legacy-peer-deps"]

[phases.build]
cmds = [
  "echo '=== Railway Build Debug ==='",
  "echo 'Current directory:' && pwd",
  "echo 'Directory contents:' && ls -la",
  "echo 'Checking src directory:' && ls -la src/ || echo 'ERROR: src/ directory not found!'",
  "echo 'Checking src/lib:' && ls -la src/lib/ || echo 'ERROR: src/lib/ directory not found!'",
  "echo 'Checking app directory:' && ls -la app/ || echo 'ERROR: app/ directory not found!'",
  "echo '=== End Debug ==='",
  "rm -rf .next",
  "npm run build"
]

[start]
cmd = "npm start"
