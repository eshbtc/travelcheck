[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --legacy-peer-deps"]

[phases.build]
cmds = [
  "echo '=== Debug: Checking tsconfig.json ==='",
  "cat tsconfig.json | grep -A 5 paths || echo 'tsconfig.json not found or no paths'",
  "echo '=== Debug: Checking if src/lib/utils.ts exists ==='",
  "ls -la src/lib/utils.ts || echo 'src/lib/utils.ts not found'",
  "echo '=== Debug: Current directory ==='",
  "pwd",
  "echo '=== Starting build ==='",
  "rm -rf .next",
  "npm run build"
]

[start]
cmd = "npm start"
